<a class="skip-link" href="#main-content">Skip to main content</a>

<mat-toolbar class="app-toolbar">
  <span class="brand">
    <app-icon name="search" />
    AuditVitals
  </span>
  <span class="toolbar-spacer"></span>
  <button
    mat-icon-button
    type="button"
    (click)="toggleTheme()"
    [attr.aria-label]="theme.mode() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
  >
    <app-icon [name]="theme.mode() === 'dark' ? 'sun' : 'moon'" />
  </button>
</mat-toolbar>

<div id="main-content">
  <router-outlet />
</div>

<footer class="app-footer">
  <p>&copy; {{ currentYear }} AuditVitals. Technical SEO auditing, prioritized.</p>
</footer>
